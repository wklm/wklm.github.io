# Strategy:
# Build the project's Docker image on a stock ubuntu-latest runner. Docker layer
# cache keeps the expensive Rocq/Crane/opam layers hot; post-only commits only
# invalidate the cheap posts-encrypted/ copy layer. The container generates
# /home/opam/crane-blog/_site, then `docker cp` moves the whole tree onto the
# host. The `build` job uploads the tree as a Pages artifact; a dependent
# `deploy` job publishes it to GitHub Pages.

name: Deploy Verified Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: crane-blog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate site in container
        run: |
          docker run --name crane-blog-run crane-blog:latest

      - name: Extract _site from container
        run: |
          docker cp crane-blog-run:/home/opam/crane-blog/_site ./_site
          docker rm crane-blog-run

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
