# Strategy:
# Build and publish the Rocq/Crane generator image only when generator inputs
# change. Post-only commits pull the existing runtime image and mount the new
# posts-encrypted/ tree, so publishing a new encrypted post avoids the slow
# Rocq/opam build path.

name: Deploy Verified Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      generator: ${{ steps.filter.outputs.generator }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect generator changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "generator=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "generator=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          if grep -Eq '^(Dockerfile|dune-project|src/|\.dockerignore)' <<<"$changed"; then
            echo "generator=true" >> "$GITHUB_OUTPUT"
          else
            echo "generator=false" >> "$GITHUB_OUTPUT"
          fi

  generator-image:
    needs: changes
    if: needs.changes.outputs.generator == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push generator image
        uses: docker/build-push-action@v6
        timeout-minutes: 45
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crane-blog-generator:latest
            ghcr.io/${{ github.repository_owner }}/crane-blog-generator:${{ github.sha }}
          cache-from: type=gha,scope=generator
          cache-to: type=gha,mode=max,scope=generator

  build:
    needs: [changes, generator-image]
    if: always() && needs.changes.result == 'success' && (needs.generator-image.result == 'success' || needs.generator-image.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source integrity tripwire (R1)
        shell: bash
        run: |
          set -euo pipefail
          # Refuse to build/deploy the empty git tree -- the signature of the
          # 2026-05 source-loss incident (commit 0a64043, tree 4b825dc...4904).
          if [[ "$(git rev-parse 'HEAD^{tree}')" == "4b825dc642cb6eb9a060e54bf8d69288fbee4904" ]]; then
            echo 'Refusing to build the EMPTY git tree (source-loss signature).' >&2
            exit 1
          fi
          # The ROCQ source-of-truth must be present; a wiped src/ is never deployable.
          if ! git ls-files 'src/*.v' | grep -q .; then
            echo 'No tracked src/*.v -- source tree looks wiped; refusing to build.' >&2
            exit 1
          fi

      - name: Archive source snapshot (R5 recovery net)
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: |
            src/
            tools/
            static/*.ml
            smtp/
            dune-project
            Dockerfile
          retention-days: 90
          if-no-files-found: warn

      - name: Check public ciphertext policy
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files 'posts/**' | grep -q .; then
            echo 'Plaintext posts are tracked:' >&2
            git ls-files 'posts/**' >&2
            exit 1
          fi
          shopt -s nullglob
          for eml in posts-encrypted/*.eml; do
            clean="$(tr -d '\r' < "$eml")"
            if ! grep -qx 'Subject: \.\.\.' <<<"$clean"; then
              echo "$eml does not have outer Subject: ..." >&2
              exit 1
            fi
            is_hpke=$(grep -qi '^Content-Type: multipart/hpke+wrapped' <<<"$clean" && echo yes || echo no)
            is_pgp=$(grep -qi '^Content-Type: multipart/encrypted;.*protocol="application/pgp-encrypted"' <<<"$clean" && echo yes || echo no)
            if [ "$is_hpke" = "no" ] && [ "$is_pgp" = "no" ]; then
              echo "$eml is not a recognized encrypted envelope format (HPKE or PGP/MIME)" >&2
              exit 1
            fi
            if grep -Eq '^(From|To|Date): ' <<<"$clean"; then
              echo "$eml exposes sender, recipient, or date metadata" >&2
              exit 1
            fi
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate site with published generator
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p _site
          image="ghcr.io/${{ github.repository_owner }}/crane-blog-generator:latest"
          if [[ "${{ needs.changes.outputs.generator }}" == "true" ]]; then
            image="ghcr.io/${{ github.repository_owner }}/crane-blog-generator:${{ github.sha }}"
          fi
          docker pull "$image"
           docker run --rm \
             -v "$PWD/posts-encrypted:/site/posts-encrypted:ro" \
             -v "$PWD/static:/site/static:ro" \
             -v "$PWD/_site:/site/_site" \
             "$image"

      - name: Check generated site policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -i '<img' _site; then
            echo 'Generated site contains <img> tags' >&2
            exit 1
          fi
          unapproved=$(grep -R '<script' _site | grep -v 'static/crane_bridge.js\|static/decrypt.js\|static/enroll.js' || true)
          if [[ -n "$unapproved" ]]; then
            echo 'Generated site contains unapproved <script> tags:' >&2
            echo "$unapproved" >&2
            exit 1
          fi
          if grep -R '<dt>Subject</dt>' _site; then
            echo 'Generated post pages render a Subject header row' >&2
            exit 1
          fi
          if ! grep -R 'Subject: \.\.\.' _site >/dev/null; then
            echo 'Generated site does not show the placeholder subject' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
