# Facet A WASM acceptance gate — the durable proof that the ROCQ->C++->WASM
# browser runtime (enroll + decrypt) works in a real headless browser.
#
# Runs on the self-hosted runner (fuji), which has Node + Playwright 1.60 +
# Chromium preinstalled (~/.cache/ms-playwright) and the host Docker daemon with
# the cached crane-blog:builder / wasm layers.  The job:
#   1. builds the WASM artifacts (em++ links the Crane-extracted browser C++) and
#      the runtime generator image;
#   2. stages a servable _site (extract the four crane_*.{mjs,wasm} into static/,
#      render _site from posts-encrypted/ + static/) via tests/e2e/stage-site.sh;
#   3. runs the Playwright e2e: HTTPS-served https://wklm.online + a CDP virtual
#      WebAuthn authenticator -> in-browser enroll, then encrypt a fixture to the
#      enrolled key and decrypt + render it in-browser.
name: Facet A WASM e2e (browser enroll + decrypt)

on:
  push:
    branches: [main, feat/rocq-single-source]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      # Image names the staging script / helpers expect.
      CRANE_BLOG_WASM_IMAGE: crane-blog:wasm-merged
      CRANE_BLOG_GEN_IMAGE: crane-blog-gen
    steps:
      - uses: actions/checkout@v4

      - name: Source present (refuse a wiped tree)
        run: |
          set -eu
          ls src/*.v >/dev/null 2>&1 || { echo 'No src/*.v — refusing to run on a wiped source tree.'; exit 1; }

      - name: Tooling versions
        run: |
          set -eu
          docker version
          node --version
          npx playwright --version

      # The WASM artifacts come from the wasm stage (em++ links the Crane-extracted
      # browser C++).  Layer caching on the self-hosted runner keeps the heavy
      # builder stage warm; only the em++ link re-runs when src/ changes.
      - name: Build WASM image (crane_{decrypt,enroll}.{mjs,wasm})
        run: docker build --target wasm -t "$CRANE_BLOG_WASM_IMAGE" .

      # The wasm stage depends on the builder stage, so this is a cache hit;
      # it tags the stage so the WF9 tail-position gate can extract the
      # freshly extracted C++ (same policy set as the deploy workflow).
      - name: Tag builder stage (for the tail-position gate)
        run: docker build --target builder -t crane-blog:builder .

      - name: Tail-position stack gate on extracted C++ (WF9)
        run: |
          set -eu
          rm -rf /tmp/formalblog-cpp && mkdir -p /tmp/formalblog-cpp
          docker run --rm crane-blog:builder bash -c \
            'cd /home/opam/crane-blog/_build/default/FormalBlog && tar -cf - *.cpp' \
            | tar -xf - -C /tmp/formalblog-cpp
          bash scripts/check-tail-position.sh /tmp/formalblog-cpp

      - name: Public ciphertext policy (incl. signed-envelope requirement)
        run: |
          set -eu
          if ls posts/*.md >/dev/null 2>&1; then echo 'Plaintext posts/*.md present — refusing.'; exit 1; fi
          for eml in posts-encrypted/*.eml; do
            [ -e "$eml" ] || continue
            clean="$(tr -d '\r' < "$eml")"
            # here-strings, not `printf | grep -q`: see deploy.yml — -q early-exit
            # races spurious refusals on large envelopes.
            grep -x 'Subject: \.\.\.' <<<"$clean" >/dev/null || { echo "$eml: outer Subject not placeholder"; exit 1; }
            grep -iE '^Content-Type: multipart/(hpke\+wrapped|encrypted)' <<<"$clean" >/dev/null || { echo "$eml: not an encrypted envelope"; exit 1; }
            grep -E '^Signature: [0-9a-f]{128}$' <<<"$clean" >/dev/null || { echo "$eml: missing 64-byte hex Signature"; exit 1; }
            grep -E '^Signing-Key: [0-9a-f]{130}$' <<<"$clean" >/dev/null || { echo "$eml: missing 65-byte uncompressed hex Signing-Key"; exit 1; }
            if grep -E '^(From|To|Date): ' <<<"$clean" >/dev/null; then echo "$eml: leaks sender/recipient/date"; exit 1; fi
          done

      - name: Build runtime generator image
        run: docker build --target runtime -t "$CRANE_BLOG_GEN_IMAGE" .

      - name: Install e2e deps (Playwright test runner)
        run: npm ci || npm install

      - name: Install Playwright Chromium
        # DinD job containers are ephemeral and don't see the host's browser
        # cache; download the pinned Chromium AND its system libraries into the
        # job container (running as root, so --with-deps can apt-get them).
        run: npx --no-install playwright install --with-deps chromium

      - name: Stage servable _site (extract WASM + render)
        # The image is already built above; skip the in-script rebuild.
        env:
          CRANE_BLOG_BUILD_GEN: "0"
        run: bash tests/e2e/stage-site.sh

      - name: Run Playwright e2e (Facet A gate)
        # _site is staged above; don't re-stage inside global-setup.
        env:
          CRANE_BLOG_SKIP_STAGE: "1"
        run: npx --no-install playwright test

      - name: Upload Playwright report + traces on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
