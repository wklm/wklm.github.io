# Forgejo Actions deploy → wklm.online (served by git-pages via cloudflared).
# Publish mechanism adopted from the proven forgejo/main workflow (git-pages
# HTTP PUT of a tar with the Host header), hardened with the source-integrity,
# ciphertext-only, and generated-site policy checks. Runs on the self-hosted
# runner's docker executor; uses the host Docker daemon (cached layers).
name: Deploy Verified Blog (wklm.online)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Source present (R1 — refuse a wiped tree)
        run: |
          set -eu
          ls src/*.v >/dev/null 2>&1 || { echo 'No src/*.v — refusing to deploy a wiped source tree.'; exit 1; }

      - name: Single-source contract (R8 — only .v + allowlisted non-.v artifacts)
        run: bash scripts/check-single-source.sh

      - name: Shim thinness (no ceremony/protocol policy literals; async fails closed)
        run: bash scripts/check-shim-thinness.sh

      - name: Public ciphertext policy
        run: |
          set -eu
          if ls posts/*.md >/dev/null 2>&1; then echo 'Plaintext posts/*.md present — refusing.'; exit 1; fi
          for eml in posts-encrypted/*.eml; do
            [ -e "$eml" ] || continue
            clean="$(tr -d '\r' < "$eml")"
            printf '%s\n' "$clean" | grep -qx 'Subject: \.\.\.' || { echo "$eml: outer Subject not placeholder"; exit 1; }
            printf '%s\n' "$clean" | grep -qiE '^Content-Type: multipart/(hpke\+wrapped|encrypted)' || { echo "$eml: not an encrypted envelope"; exit 1; }
            if printf '%s\n' "$clean" | grep -Eq '^(From|To|Date): '; then echo "$eml: leaks sender/recipient/date"; exit 1; fi
          done

      - name: Build generator image
        run: docker build -t crane-blog .

      - name: Generate site
        run: |
          set -eu
          rm -rf _site && mkdir -p _site
          docker run --rm \
            -v "$PWD/posts-encrypted:/site/posts-encrypted:ro" \
            -v "$PWD/static:/site/static:ro" \
            -v "$PWD/_site:/site/_site" \
            crane-blog

      - name: Generated-site policy lint
        run: |
          set -eu
          if grep -R -i '<img' _site; then echo 'Generated site contains <img>'; exit 1; fi
          unapproved="$(grep -R '<script' _site | grep -v 'crane_decrypt.mjs\|crane_enroll.mjs\|ratex-formula.js' || true)"
          [ -z "$unapproved" ] || { echo "Unapproved <script> tags: $unapproved"; exit 1; }
          if grep -R '<dt>Subject</dt>' _site; then echo 'Subject header row rendered'; exit 1; fi
          grep -R 'Subject: \.\.\.' _site >/dev/null || { echo 'Placeholder subject missing'; exit 1; }

      - name: Publish to git-pages for wklm.online
        run: |
          set -eu
          cd _site && tar cf ../site.tar . && cd ..
          curl -f -X PUT http://git-pages:3000/ \
            -H "Host: wklm.online" \
            -H "Content-Type: application/x-tar" \
            --data-binary @site.tar
          echo "Deployed $(wc -c < site.tar) bytes to wklm.online"
