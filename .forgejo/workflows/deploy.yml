# Forgejo Actions deploy → wklm.online (served by git-pages via cloudflared).
# Publish mechanism adopted from the proven forgejo/main workflow (git-pages
# HTTP PUT of a tar with the Host header), hardened with the source-integrity,
# ciphertext-only, signed-envelope, and generated-site policy checks, plus the
# WF9 tail-position stack gate on the freshly extracted C++. Runs on the
# self-hosted runner's docker executor; uses the host Docker daemon (cached
# layers).  Policy set is mirrored in .github/workflows/deploy.yml (GH Pages)
# and .forgejo/workflows/e2e.yml (Facet A WASM gate).
name: Deploy Verified Blog (wklm.online)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Source present (R1 — refuse a wiped tree)
        run: |
          set -eu
          ls src/*.v >/dev/null 2>&1 || { echo 'No src/*.v — refusing to deploy a wiped source tree.'; exit 1; }

      - name: Single-source contract (R8 — only .v + allowlisted non-.v artifacts)
        run: bash scripts/check-single-source.sh

      - name: Shim thinness (no ceremony/protocol policy literals; async fails closed)
        run: bash scripts/check-shim-thinness.sh

      - name: Public ciphertext policy (incl. signed-envelope requirement)
        run: |
          set -eu
          if ls posts/*.md >/dev/null 2>&1; then echo 'Plaintext posts/*.md present — refusing.'; exit 1; fi
          for eml in posts-encrypted/*.eml; do
            [ -e "$eml" ] || continue
            clean="$(tr -d '\r' < "$eml")"
            # here-strings, not `printf | grep -q`: -q exits on first match and can
            # SIGPIPE the upstream stage, racing into spurious refusals on large
            # envelopes; and here-strings keep the whole line intact for -x.
            if ! grep -x 'Subject: \.\.\.' <<<"$clean" >/dev/null; then
              echo "$eml: outer Subject not placeholder. File head:"
              head -n 5 "$eml"
              exit 1
            fi
            grep -iE '^Content-Type: multipart/(hpke\+wrapped|encrypted)' <<<"$clean" >/dev/null || { echo "$eml: not an encrypted envelope"; exit 1; }
            grep -E '^Signature: [0-9a-f]{128}$' <<<"$clean" >/dev/null \
              || { echo "$eml: missing 64-byte hex Signature header (128 hex chars) — signed envelopes only"; exit 1; }
            grep -E '^Signing-Key: [0-9a-f]{130}$' <<<"$clean" >/dev/null \
              || { echo "$eml: missing 65-byte uncompressed hex Signing-Key header (130 hex chars) — signed envelopes only"; exit 1; }
            outer_head="$(sed -n '1,/^$/p' <<<"$clean")"
            if grep -E '^(From|To|Date): ' <<<"$outer_head" >/dev/null; then echo "$eml: leaks sender/recipient/date"; exit 1; fi
            # D-C5/A5 pin: envelope Signing-Key must equal keys/author-signing.pub
            if [[ ! -f keys/author-signing.pub ]]; then echo "$eml: keys/author-signing.pub (trust anchor) missing"; exit 1; fi
            eml_sign_key="$(grep -E '^Signing-Key: ' <<<"$outer_head" | sed 's/^Signing-Key: *//')"
            pinned="$(tr -d '\r\n ' < keys/author-signing.pub)"
            if [[ "$eml_sign_key" != "$pinned" ]]; then echo "$eml: Signing-Key does not match pinned keys/author-signing.pub"; exit 1; fi
          done

      - name: Build generator image (+ builder stage for the tail-position gate)
        run: |
          set -eu
          docker build -t crane-blog .
          docker build --target builder -t crane-blog:builder .

      - name: Tail-position stack gate on extracted C++ (WF9)
        run: |
          set -eu
          rm -rf /tmp/formalblog-cpp && mkdir -p /tmp/formalblog-cpp
          docker run --rm crane-blog:builder bash -c \
            'cd /home/opam/crane-blog/_build/default/FormalBlog && tar -cf - *.cpp' \
            | tar -xf - -C /tmp/formalblog-cpp
          bash scripts/check-tail-position.sh /tmp/formalblog-cpp

      - name: Generate site
        # DinD-safe: the self-hosted runner mounts only docker.sock, so -v
        # bind mounts resolve against the HOST daemon and $PWD/... is an empty
        # dir.  Use docker cp instead: create, copy inputs in, start (runs the
        # runtime CMD = generator), copy _site back out.
        run: |
          set -eu
          rm -rf _site && mkdir -p _site
          cid="$(docker create crane-blog)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp posts-encrypted "$cid":/site/posts-encrypted
          docker cp static "$cid":/site/static
          docker cp keys "$cid":/site/keys
          docker start -a "$cid"
          # Trailing /. copies CONTENTS into the existing ./_site dir
          # (a bare path would nest as _site/_site).
          docker cp "$cid":/site/_site/. ./_site/
          docker rm -f "$cid" >/dev/null 2>&1 || true
          trap - EXIT

      - name: Generated-site policy lint
        run: |
          set -eu
          if grep -R -i '<img' _site; then echo 'Generated site contains <img>'; exit 1; fi
          unapproved="$(grep -R '<script' _site | grep -v 'crane_decrypt.mjs\|crane_enroll.mjs\|ratex-formula.js' || true)"
          [ -z "$unapproved" ] || { echo "Unapproved <script> tags: $unapproved"; exit 1; }
          if grep -R '<dt>Subject</dt>' _site; then echo 'Subject header row rendered'; exit 1; fi
          grep -R 'Subject: \.\.\.' _site >/dev/null || { echo 'Placeholder subject missing'; exit 1; }

      - name: Publish to git-pages for wklm.online
        # DinD-safe: git-pages listens on the scripts_default network, not the
        # runner's bridge — publish from a throwaway curl container attached to
        # that network, streaming the tar on stdin (no bind mount needed).
        run: |
          set -eu
          cd _site && tar cf ../site.tar . && cd ..
          cat site.tar | docker run --rm -i \
            --network scripts_default \
            curlimages/curl -s -f -X PUT http://git-pages:3000/ \
              -H "Host: wklm.online" \
              -H "Content-Type: application/x-tar" \
              --data-binary @-
          echo "Deployed $(wc -c < site.tar) bytes to wklm.online"
